<!DOCTYPE html>
<!--
  ============================================================
  RELOJ DIGITAL INTERACTIVO
  ============================================================
  Archivo     : reloj.html
  Versión     : 1.0
  Descripción : Reloj digital en tiempo real con soporte para
                múltiples zonas horarias, formato 12h/24h y
                visualización opcional de segundos.

  Estructura del documento:
    1. Configuración del documento  (head)
    2. Estructura HTML              (body)
      2.1  Contenedor principal    (.clock-shell)
      2.2  Tarjeta del reloj       (.clock-card)
            — Etiqueta de título
            — Display de dígitos   (HH : MM : SS)
            — Fila de fecha
            — Línea divisora
            — Botones de control
            — Selector de zona horaria
            — Indicador de estado en tiempo real
    3. Lógica JavaScript
      3.1  Configuración de zonas horarias
      3.2  Variables de estado
      3.3  Referencias al DOM
      3.4  Generación dinámica de botones TZ
      3.5  Función auxiliar         pad()
      3.6  Función principal        tick()
      3.7  Manejadores de eventos
      3.8  Inicialización del intervalo

  Dependencias externas:
    — Google Fonts : Share Tech Mono, Rajdhani
    — reloj.css    : estilos, animaciones y temas de color

  Compatibilidad:
    — Navegadores modernos con soporte para Intl.DateTimeFormat
    — Diseño responsivo mediante clamp() en font-size
  ============================================================
-->
<html lang="es">
<head>
  <!-- Codificación de caracteres UTF-8 para soporte de tildes y ñ -->
  <meta charset="UTF-8" />

  <!-- Viewport: escala correcta en dispositivos móviles y tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Título visible en la pestaña del navegador -->
  <title>Reloj Digital</title>

  <!-- Hoja de estilos externa — debe estar en la misma carpeta que este archivo -->
  <link rel="stylesheet" href="reloj.css" />
</head>
<body>

  <!-- ============================================================
      2.1  CONTENEDOR PRINCIPAL  (.clock-shell)
      Envuelve toda la interfaz y centra la tarjeta tanto en
      el eje horizontal como en el vertical usando Flexbox.
  ============================================================ -->
  <div class="clock-shell">

    <!-- ============================================================
        2.2  TARJETA DEL RELOJ  (.clock-card)
        Panel oscuro con bordes redondeados que agrupa todos los
        elementos visuales. Su pseudo-elemento ::before dibuja
        la línea de luz degradada animada en la parte superior
        (definida y animada íntegramente en reloj.css).
    ============================================================ -->
    <div class="clock-card">

      <!-- Etiqueta decorativa superior con espaciado de letras amplio -->
      <div class="clock-label">Sistema de Tiempo</div>


      <!-- ──────────────────────────────────────────────────────
          DISPLAY DE DÍGITOS  (id="display")
          Bloque principal del reloj. Contiene tres spans para
          horas (hh), minutos (mm) y segundos (ss), separados
          por dos puntos que parpadean cada segundo mediante la
          animación "blink" definida en el CSS.
          Al hacer clic sobre este bloque se activa o desactiva
          el modo pausa (lógica en la sección 3.7 del script).
      ────────────────────────────────────────────────────────── -->
      <div class="clock-digits" id="display" title="Clic para pausar / reanudar">
        <span id="hh">--</span>                        <!-- Horas   (se rellena con pad()) -->
        <span class="colon-blink" id="colon1">:</span> <!-- Separador HH:MM  (parpadea) -->
        <span id="mm">--</span>                        <!-- Minutos -->
        <span class="colon-blink" id="colon2">:</span> <!-- Separador MM:SS  (parpadea) -->
        <span id="ss">--</span>                        <!-- Segundos (se oculta si showSeconds=false) -->
      </div>


      <!-- Fila de fecha completa en español: día semana, número, mes y año -->
      <div class="date-row" id="date-display">— — —</div>

      <!-- Línea divisora decorativa entre la fecha y los botones de control -->
      <div class="divider"></div>


      <!-- ──────────────────────────────────────────────────────
          BOTONES DE CONTROL  (.controls)
          Tres acciones principales del reloj:
            btn-24      → alterna entre formato 12h y 24h
            btn-pause   → pausa o reanuda la actualización
            btn-seconds → muestra u oculta los segundos
          Los estados activos se reflejan con la clase CSS ".active".
      ────────────────────────────────────────────────────────── -->
      <div class="controls">
        <button class="btn" id="btn-24">12H</button>
        <button class="btn" id="btn-pause">Pausar</button>
        <button class="btn" id="btn-seconds">Ocultar seg.</button>
      </div>


      <!-- ──────────────────────────────────────────────────────
          SELECTOR DE ZONA HORARIA  (#tz-row)
          Contenedor vacío al cargar la página. Los botones se
          insertan dinámicamente desde el array tzOptions definido
          en la sección 3.1 del script, usando createElement().
      ────────────────────────────────────────────────────────── -->
      <div class="timezone-row" id="tz-row"></div>


      <!-- ──────────────────────────────────────────────────────
          INDICADOR DE ESTADO  (.status-row)
          Muestra un punto pulsante (animación "pulse" en CSS)
          junto a un texto descriptivo del estado actual.
          Al pausar: punto cambia a violeta y detiene su animación.
          Al reanudar: vuelve al cian con pulso activo.
      ────────────────────────────────────────────────────────── -->
      <div class="status-row">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">Actualización en tiempo real</span>
      </div>

    </div><!-- /clock-card -->
  </div><!-- /clock-shell -->


  <!-- ============================================================
      3.  LÓGICA JAVASCRIPT
      Ubicado al final del <body> para asegurar que el DOM esté
      completamente cargado antes de acceder a los elementos.
      No se requieren librerías externas: usa únicamente APIs
      nativas del navegador (Intl, setInterval, getElementById).
  ============================================================ -->
  <script>

    /* ──────────────────────────────────────────────────────────
      3.1  CONFIGURACIÓN DE ZONAS HORARIAS
      Array de objetos con dos propiedades cada uno:
        label → texto visible en el botón de selección
        tz    → identificador IANA de la zona horaria,
                utilizado por Intl.DateTimeFormat
    ────────────────────────────────────────────────────────── */
    const tzOptions = [
      { label: 'Buenos Aires', tz: 'America/Argentina/Buenos_Aires' },
      { label: 'Madrid',       tz: 'Europe/Madrid'                  },
      { label: 'Nueva York',   tz: 'America/New_York'               },
      { label: 'Londres',      tz: 'Europe/London'                  },
      { label: 'Tokio',        tz: 'Asia/Tokyo'                     },
    ];

    /* ──────────────────────────────────────────────────────────
      3.2  VARIABLES DE ESTADO
      Controlan la configuración activa del reloj en todo momento.
      Se modifican exclusivamente desde los manejadores de eventos.

        paused      → true  = reloj detenido, tick() no actualiza
        use12h      → true  = mostrar hora en formato AM/PM
        showSeconds → true  = mostrar el contador de segundos
        currentTZ   → zona horaria seleccionada actualmente
    ────────────────────────────────────────────────────────── */
    let paused      = false;
    let use12h      = false;
    let showSeconds = true;
    let currentTZ   = 'America/Argentina/Buenos_Aires';

    /* ──────────────────────────────────────────────────────────
      3.3  REFERENCIAS AL DOM
      Se obtienen una sola vez y se guardan en constantes para
      mejorar el rendimiento, evitando búsquedas repetidas en
      el árbol de nodos en cada ciclo de tick().
    ────────────────────────────────────────────────────────── */
    const display    = document.getElementById('display');      // Bloque completo de dígitos
    const hhEl       = document.getElementById('hh');           // Span: horas
    const mmEl       = document.getElementById('mm');           // Span: minutos
    const ssEl       = document.getElementById('ss');           // Span: segundos
    const colon2     = document.getElementById('colon2');       // Separador MM:SS
    const dateEl     = document.getElementById('date-display'); // Fila de fecha
    const statusDot  = document.getElementById('status-dot');   // Punto indicador
    const statusText = document.getElementById('status-text');  // Texto de estado
    const btn24      = document.getElementById('btn-24');       // Botón 12h/24h
    const btnPause   = document.getElementById('btn-pause');    // Botón pausar
    const btnSec     = document.getElementById('btn-seconds');  // Botón segundos
    const tzRow      = document.getElementById('tz-row');       // Contenedor de botones TZ

    /* ──────────────────────────────────────────────────────────
      3.4  GENERACIÓN DINÁMICA DE BOTONES DE ZONA HORARIA
      Recorre tzOptions y crea un <button class="tz-btn"> por
      cada entrada. La zona activa por defecto recibe la clase
      "active" desde el momento de su creación.
      Al hacer clic, se actualiza currentTZ, se reasigna "active"
      y se fuerza una actualización inmediata del display.
    ────────────────────────────────────────────────────────── */
    tzOptions.forEach(opt => {
      const b       = document.createElement('button');
      b.className   = 'tz-btn' + (opt.tz === currentTZ ? ' active' : '');
      b.textContent = opt.label;

      b.onclick = () => {
        currentTZ = opt.tz;

        /* Quitar "active" de todos los botones TZ y aplicarlo solo al seleccionado */
        document.querySelectorAll('.tz-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');

        tick(); /* Refrescar display con la nueva zona horaria de inmediato */
      };

      tzRow.appendChild(b);
    });

    /* ──────────────────────────────────────────────────────────
      3.5  FUNCIÓN AUXILIAR: pad(n)
      Garantiza que los números de un solo dígito se muestren
      siempre con dos caracteres, añadiendo un cero inicial.
      Ejemplo:  pad(3)  →  "03"
                pad(12) →  "12"
    ────────────────────────────────────────────────────────── */
    function pad(n) {
      return String(n).padStart(2, '0');
    }

    /* ──────────────────────────────────────────────────────────
      3.6  FUNCIÓN PRINCIPAL: tick()
      Corazón del reloj. Se ejecuta cada segundo mediante
      setInterval y también de forma inmediata al cambiar
      cualquier configuración (zona horaria, formato, etc.).

      Flujo interno:
        1. Verificar si el reloj está pausado → salir si es así
        2. Obtener la fecha/hora actual con new Date()
        3. Formatear con Intl.DateTimeFormat usando la zona y
            configuración activas, obteniendo partes individuales
        4. Actualizar los spans de horas, minutos y segundos
        5. Aplicar visibilidad del separador y segundos
        6. Construir y mostrar la cadena de fecha completa
    ────────────────────────────────────────────────────────── */
    function tick() {

      /* Paso 1: No hacer nada si el reloj está en pausa */
      if (paused) return;

      /* Paso 2: Capturar el instante actual */
      const now = new Date();

      /* Paso 3: Descomponer fecha/hora en partes nombradas según zona horaria */
      const parts = new Intl.DateTimeFormat('es-AR', {
        timeZone: currentTZ,
        hour:    'numeric',  // Número de hora (respeta hour12)
        minute:  '2-digit',  // Minutos con cero inicial
        second:  '2-digit',  // Segundos con cero inicial
        hour12:  use12h,     // true → AM/PM   false → 24h
        weekday: 'long',     // Nombre completo del día ("lunes")
        day:     'numeric',  // Número del día del mes
        month:   'long',     // Nombre completo del mes ("mayo")
        year:    'numeric',  // Año con 4 dígitos
      }).formatToParts(now);

      /* Ayudante local: extrae el valor de una parte por su tipo */
      const get = type => (parts.find(p => p.type === type) || {}).value || '';

      /* Paso 4: Volcar horas, minutos y segundos en el DOM */
      hhEl.textContent = pad(parseInt(get('hour'))); // parseInt elimina posibles ceros extra
      mmEl.textContent = get('minute');
      ssEl.textContent = get('second');

      /* Paso 5: Ocultar separador y segundos si el usuario lo desactivó */
      colon2.style.display = showSeconds ? '' : 'none';
      ssEl.style.display   = showSeconds ? '' : 'none';

      /* Paso 6: Construir la cadena de fecha en español */
      let dateStr = `${get('weekday')}, ${get('day')} de ${get('month')} de ${get('year')}`;

      /* En modo 12h, agregar el periodo AM/PM al final de la fecha */
      const period = get('dayPeriod');
      if (use12h && period) dateStr += ' · ' + period.toUpperCase();

      dateEl.textContent = dateStr;
    }

    /* ──────────────────────────────────────────────────────────
      3.7  MANEJADORES DE EVENTOS

      PAUSA (clic en el display o en el botón "Pausar")
        Invierte el valor de "paused", aplica/quita la clase
        CSS "paused" en el display y en el punto indicador,
        actualiza el texto del botón y el mensaje de estado.
        Al reanudar, llama a tick() de inmediato para que el
        display no quede en blanco durante un segundo.

      FORMATO 12H / 24H  (btn-24)
        Invierte "use12h", actualiza el label del botón y
        fuerza una nueva llamada a tick().

      SEGUNDOS  (btn-seconds)
        Invierte "showSeconds", actualiza el label y llama
        a tick() para aplicar el cambio de visibilidad.
    ────────────────────────────────────────────────────────── */

    /* — Pausar / Reanudar al hacer clic directamente sobre los dígitos — */
    display.onclick = () => {
      paused = !paused;

      display.classList.toggle('paused', paused);    // Dígitos cambian a violeta
      statusDot.classList.toggle('paused', paused);  // Punto se detiene y cambia de color

      btnPause.textContent = paused ? 'Reanudar' : 'Pausar';
      btnPause.classList.toggle('active', paused);

      statusText.textContent = paused
        ? 'Reloj pausado'
        : 'Actualización en tiempo real';

      if (!paused) tick(); // Actualizar de inmediato al reanudar
    };

    /* — El botón "Pausar" delega su acción en el clic del display — */
    btnPause.onclick = () => display.click();

    /* — Alternar formato de 12 horas y 24 horas — */
    btn24.onclick = () => {
      use12h = !use12h;
      btn24.textContent = use12h ? '24H' : '12H'; // Muestra el formato OPUESTO disponible
      btn24.classList.toggle('active', use12h);
      tick();
    };

    /* — Mostrar u ocultar el contador de segundos — */
    btnSec.onclick = () => {
      showSeconds = !showSeconds;
      btnSec.textContent = showSeconds ? 'Ocultar seg.' : 'Mostrar seg.';
      btnSec.classList.toggle('active', !showSeconds);
      tick();
    };

    /* ──────────────────────────────────────────────────────────
      3.8  INICIALIZACIÓN
      Se llama a tick() de forma inmediata para mostrar la hora
      correcta en cuanto carga la página, sin esperar el primer
      disparo del intervalo. Luego setInterval mantiene el reloj
      sincronizado actualizándolo cada 1000 ms (1 segundo).
    ────────────────────────────────────────────────────────── */
    tick();
    setInterval(tick, 1000);

  </script>

</body>
</html>
